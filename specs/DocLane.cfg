\* DocLane.cfg — TLC configuration for the doc lane (DESIGN-transport-proof.md
\* A4/A5/A6, T5, O3'). Small finite constants: 2 clients, one document,
\* 5 ledger appends — TLC exhausts the space completely.
\*
\* Run record (TLC 2.19, vendored specs/tla2tools.jar, Apple Silicon,
\* 14 workers, 2026-08-27): complete — 18,785,490 states generated,
\* 1,118,481 distinct, depth 16, 0 left on queue; no error. Every
\* invariant and all three temporal properties (MonotoneCursor,
\* PerSeqReceipt, ConvergenceAfterQuiescence) hold. Wall time 8min 26s —
\* the liveness check (6 tableau branches) dominates; safety alone
\* finishes in about a minute.

SPECIFICATION Spec

\* The intended quiescent state (ledgerLen = MaxSeq, chan = {}, every
\* cursor[c] = ledgerLen) disables all four actions: that is convergence —
\* the good ending — not a deadlock. Any state where some cursor[c] <
\* ledgerLen still has Pull(c) enabled, so quiescence implies converged.
\* Disable TLC's default deadlock check accordingly.
CHECK_DEADLOCK FALSE

CONSTANTS
  Clients = {c1, c2}
  MaxSeq  = 5

INVARIANTS
  TypeOK
  NoCursorSkip     \* invariant (1): cursor never exceeds contiguous prefix
  ReceivedSound    \* clients never hold an uncommitted seq

PROPERTIES
  MonotoneCursor   \* invariant (3): cursor is nondecreasing (action property)
  PerSeqReceipt    \* property (2): every committed seq n eventually reaches
                   \* every client (per-seq leads-to; T5's actual claim --
                   \* does not lean on append quiescence)
  ConvergenceAfterQuiescence
                   \* property (2'): whole-set corollary; meaningful only
                   \* because MaxSeq bounds appends (see the .tla comment)

\* To reproduce the permanent-gap counterexample (landmine 2 / O3'):
\* in DocLane.tla, replace Deliver with the commented-out DeliverHighWater
\* in Next and rerun — TLC reports a NoCursorSkip violation at the
\* 1,2,5 delivery and a PerSeqReceipt/ConvergenceAfterQuiescence lasso
\* with received = {1,2,5} forever.
