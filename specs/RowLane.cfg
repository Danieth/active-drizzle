\* RowLane.cfg -- TLC configuration for the row-lane O8 model.
\* Constants: 2 clients and 2 fields (the ASSUME minimums; more of either
\* multiplies the space without adding checkable behavior), one identity
\* lineage of up to MaxToken commits, MaxEpoch subscription epochs.
\*
\* MaxToken coverage: 3 reaches every defect found so far -- including
\* the Apply304 GC + stale re-merge T4 violation fixed in rev 2 of the
\* spec (an 11-state trace) -- plus destroy -> re-create (create@1,
\* destroy@2, create@3) and the destroyed-at-11 case.  4 adds a write on
\* both sides of a lifecycle event; 5 covers the full L2 counterexample
\* trace {a@2}.D3.{b@5}.
\*
\* MaxEpoch = 3 is load-bearing, not padding: DeliverReset's Max2 join
\* (a reordered stale RESET must not lower the epoch, T9(ii)) is only
\* distinguishable from blind assignment when one client can see TWO
\* distinct resets -- verified by mutation: epoch' := m.ep is caught at
\* MaxEpoch = 3 (NoRegression, 5-state trace, resets delivered
\* ep-3-then-ep-2) and is unreachable at MaxEpoch = 2, where a single
\* reset makes assignment and max indistinguishable.
\*
\* Cost honesty (measured 2026-08-27, TLC 2.19, Apple Silicon): this
\* space is NOT exhausted in minutes.  At MaxToken = 3 the pre-fix
\* ComponentwiseTruth violation surfaced in ~5 min, but the full
\* reachable space is order 10^8 distinct states: 59 min on 6 workers
\* explored 140.7M distinct states (1.37B generated, BFS frontier depth
\* 16, ~64M queued) at MaxEpoch = 2, and 17 min on 14 workers reached
\* 89.8M distinct at MaxEpoch = 3 -- no violation in either run.  Treat
\* full exhaustion as an overnight job even at these constants; each +1
\* on MaxToken is roughly another order of magnitude.
\*
\* No SYMMETRY: the two PROPERTY entries are action properties, and TLC's
\* symmetry reduction is unsound for temporal/action checking.
SPECIFICATION Spec

CONSTANTS
  Clients  = {c1, c2}
  Fields   = {fa, fb}
  MaxToken = 3
  MaxEpoch = 3

\* Re-deliveries and stutters are always possible; deadlock is meaningless
\* here.  (CHECK_DEADLOCK needs tla2tools >= 1.6.0; run-tlc.sh also passes
\* -deadlock, and its download note pins the minimum version.)
CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  NoResurrection          \* O8 (2) -- T2(ii), incl. pk re-creation
  FloorIsMaxDestroy       \*          supporting: floor = join of merged destroys
  No304AcrossLifecycle    \* O8 (4) -- A2' clauses (i)-(iii) on every pending 304
  NoPreEpochAccept        \* O8 (5) -- T9/O16 epoch filter
  ComponentwiseTruth      \* O8 (6) -- T4 valid stale state

PROPERTIES
  NoRegression            \* O8 (1) -- T2(i): lastSeen/floor/knownVersion/epoch
  No304Freshen            \* O8 (3) -- a 304 never freshens an unheld cell
